version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: openriskos-postgres
    environment:
      POSTGRES_DB: openriskos
      POSTGRES_USER: openriskos
      POSTGRES_PASSWORD: openriskos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openriskos -d openriskos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openriskos

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: openriskos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openriskos

  # Kafka Message Queue
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: openriskos-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - openriskos

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: openriskos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - openriskos

  # API Gateway
  api-gateway:
    container_name: openriskos-api-gateway
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/api-gateway:/app
    environment:
      NODE_ENV: development
      PORT: 3000
      RISK_SERVICE_URL: http://risk-service:3001
      COMPLIANCE_SERVICE_URL: http://compliance-service:3002
      INCIDENT_SERVICE_URL: http://incident-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3004
      VENDOR_SERVICE_URL: http://vendor-service:3005
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - risk-service
      - compliance-service
      - incident-service
      - audit-service
      - vendor-service
    networks:
      - openriskos

  # Risk Service
  risk-service:
    container_name: openriskos-risk-service
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/risk-service:/app
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://openriskos:openriskos_password@postgres:5432/openriskos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openriskos

  # Compliance Service
  compliance-service:
    container_name: openriskos-compliance-service
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/compliance-service:/app
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://openriskos:openriskos_password@postgres:5432/openriskos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3002:3002"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openriskos

  # Incident Service
  incident-service:
    container_name: openriskos-incident-service
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/incident-service:/app
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://openriskos:openriskos_password@postgres:5432/openriskos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3003:3003"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openriskos

  # Audit Service
  audit-service:
    container_name: openriskos-audit-service
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/audit-service:/app
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://openriskos:openriskos_password@postgres:5432/openriskos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3004:3004"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openriskos

  # Vendor Service
  vendor-service:
    container_name: openriskos-vendor-service
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/vendor-service:/app
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://openriskos:openriskos_password@postgres:5432/openriskos
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3005:3005"
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openriskos

volumes:
  postgres_data:

networks:
  openriskos:
    driver: bridge
